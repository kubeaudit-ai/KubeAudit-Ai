# Demo: a realistic but insecure deployment, to show what KubeAudit AI catches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: acme/payments-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: STRIPE_SECRET_KEY
              value: sk_live_do_not_commit_me
          securityContext:
            privileged: true
