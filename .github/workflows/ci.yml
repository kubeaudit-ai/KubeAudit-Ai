name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest httpx
      - name: Migrations (empty, legacy and upgrade/downgrade) on Postgres
        run: |
          for s in fresh legacy cycle; do PYTHONPATH=. python tests/migration_check.py $s; done
      - name: Test suite on Postgres
        run: |
          PYTHONPATH=. python -c "from app.migrate import upgrade_database; upgrade_database()"
          pytest -q

  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest httpx

      - name: Run Test Suite
        run: pytest

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm Lint
        run: helm lint charts/kubeaudit-ai/

      - name: Create kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubeaudit-ci

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.1/cert-manager.yaml
          kubectl wait --namespace cert-manager --for=condition=ready pod --all --timeout=120s

      - name: Build Application Image
        run: |
          docker build --provenance=false -t kubeaudit-ai:latest .
          kind load docker-image kubeaudit-ai:latest --name kubeaudit-ci

      - name: Deploy Helm Chart
        run: |
          helm install kubeaudit charts/kubeaudit-ai/ \
            --namespace kubeaudit \
            --create-namespace \
            --set image.repository=kubeaudit-ai \
            --set image.tag=latest \
            --set image.pullPolicy=Never
          kubectl get mutatingwebhookconfiguration -l app.kubernetes.io/name=kubeaudit-ai
          kubectl get validatingwebhookconfiguration -l app.kubernetes.io/name=kubeaudit-ai
      - name: Wait for webhook pod to become ready
        run: |
          if ! kubectl rollout status deployment/kubeaudit-kubeaudit-ai -n kubeaudit --timeout=180s; then
            kubectl get pods -n kubeaudit -o wide
            kubectl describe pods -n kubeaudit
            kubectl logs -n kubeaudit -l app=kubeaudit-ai --tail=100 || true
            exit 1
          fi

      - name: Scan this repository with KubeAudit (dogfooding)
        run: kubeaudit scan . --fail-on high

      - name: Execute In-Cluster Helm Test
        run: helm test kubeaudit -n kubeaudit --timeout=60s
