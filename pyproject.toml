[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeaudit-ai"
version = "1.2.0"
description = "Kubernetes manifest and Helm chart security scanner, GitHub Action, and admission webhook"
readme = "README.md"
requires-python = ">=3.10"
# The scanner and CLI only need PyYAML. Server/webhook dependencies are an extra.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
server = [
    "alembic>=1.13.0",
    "stripe>=7.0.0",
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "sqlalchemy",
    "prometheus-client",
    "psycopg[binary]>=3.2",
]

[project.scripts]
kubeaudit = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
