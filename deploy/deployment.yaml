apiVersion: v1
kind: Namespace
metadata:
  name: kubeaudit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeaudit-deployment
  namespace: kubeaudit
  annotations:
    # Local kind workflow: the image is built and side-loaded as kubeaudit-ai:latest.
    kubeaudit.ai/ignore: "KA009"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeaudit
  template:
    metadata:
      labels:
        app: kubeaudit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: kubeaudit
          image: kubeaudit-ai:latest
          imagePullPolicy: IfNotPresent
          command:
            - "uvicorn"
            - "app.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8443"
            - "--ssl-keyfile"
            - "/etc/certs/tls.key"
            - "--ssl-certfile"
            - "/etc/certs/tls.crt"
          env:
            - name: DATABASE_URL
              value: "sqlite:////data/kubeaudit.db"
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tls-certs
              mountPath: "/etc/certs"
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls-certs
          secret:
            secretName: kubeaudit-tls
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubeaudit-service
  namespace: kubeaudit
spec:
  ports:
    - port: 443
      targetPort: 8443
  selector:
    app: kubeaudit
